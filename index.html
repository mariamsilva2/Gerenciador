<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/style.css">

    <title>login</title>
</head>
<body>
    <main id="container"> 
        <form id="login_form">
            <div id="form_header">
                    <h1>Login</h1> 
            </div>
            <div id="inputs">
                <div class="input_box">
                    <label for="name">Nome
                       <div class="input_field">
                             <i class="fa-solid fa-user"></i>
                             <input type="text" id="name" name="name" placeholder=" ">
                        </div> 
                    </label>
                </div>

                <div class="input_box">
                    <label for="email">Email
                       <div class="input_field">
                             <i class="fa-solid fa-envelope"></i>
                             <input type="email" id="email" name="email" placeholder=" ">
                        </div> 
                    </label>
                </div>

                <div class="input_box">
                    <label for="password">Senha
                       <div class="input_field">
                             <i class="fa-solid fa-key"></i>
                             <input type="password" id="password" name="password" placeholder=" ">
                        </div> 
                    </label>
                </div>

                <div id="forgot_password">
                    <a href="criar_conta.html">Criar Conta</a>
                </div>
            </div>

            <button type="submit" id="login_button" onclick="login(); return false">Entrar</button>

        </form>
    </main>
    
    <script>
        function login() {
            var nameDigitado = document.getElementById('name').value;
            var emailDigitado = document.getElementById('email').value;
            var passwordDigitado = document.getElementById('password').value;

            var nameArmazenado = localStorage.getItem('name');
            var emailArmazenado = localStorage.getItem('email');
            var passwordArmazenado = localStorage.getItem('password');

            if (nameDigitado === nameArmazenado && emailDigitado === emailArmazenado && passwordDigitado === passwordArmazenado) {
                alert('Login bem-sucedido!');
                location.href = 'gerenciador.html';
            } else {
                alert('Credenciais inválidas. Tente novamente.');
            }
        }
    </script>
</body>
</html>
